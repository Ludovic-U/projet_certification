version: "3.9"

services:
  postgres-test:
    image: postgres:17
    container_name: myapp_postgres_test
    restart: always
    environment:
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
      POSTGRES_DB: myapp_test
    ports:
      - "5433:5432"  # Use a different port than dev DB
    volumes:
      - pg_test_data:/var/lib/postgresql/data

volumes:
  pg_test_data: